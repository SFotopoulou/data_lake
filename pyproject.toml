[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-lake"
version = "0.2.0"
description = "Astronomy data lake: wide multi-survey catalogs (Parquet/HATS) + galaxy cutout stacks (Zarr v3)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sotiria Fotopoulou" }]
requires-python = ">=3.11"
dependencies = [
    # Array / columnar I/O
    "pyarrow>=15.0",
    "zarr>=3.0",
    "numcodecs>=0.13",
    # Catalog query engines
    "duckdb>=0.10",
    "polars>=0.20",
    # Astronomy
    "astropy>=6.0",
    "healpy>=1.16",
    # ML
    "torch>=2.2",
    "numpy>=1.26",
    "h5py>=3.10",
    # Utilities
    "tqdm>=4.66",
    "click>=8.1",
]

[project.optional-dependencies]
desi = ["desispec>=0.62"]
fitsio = ["fitsio>=1.2"]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ipykernel",
    "jupyterlab",
    "matplotlib",
    "napari",
]

[project.scripts]
dl-init                 = "data_lake.admin.init_lake:dl_init"
dl-set-ingest-token     = "data_lake.admin.set_ingest_token:dl_set_ingest_token"
dl-ingest-catalog  = "data_lake.ingest.fits_to_parquet:cli"
dl-finalize-catalog = "data_lake.ingest.fits_to_parquet:cli_finalize"
dl-repair-catalog-metadata = "data_lake.ingest.repair_catalog_metadata:main"
dl-debug-specobj-lookup = "data_lake.ingest.sdss_specobj_lookup_debug:cli"
dl-recommend-catalog-norder = "data_lake.ingest.recommend_norder:cli"
dl-describe-survey = "data_lake.schema_registry:cli"
dl-describe-lake = "data_lake.lake_registry:cli_describe_lake"
dl-describe-master = "data_lake.lake_registry:cli_describe_master"
dl-refresh-lake-registry = "data_lake.lake_registry:cli_refresh"
dl-build-query-from-master = "data_lake.query_from_master:cli"
dl-crossmatch = "data_lake.io.crossmatch:cli"
dl-ingest-cutouts  = "data_lake.ingest.fits_to_zarr:cli"
dl-ingest-spectra  = "data_lake.ingest.fits_to_spectra_zarr:cli"
dl-ingest-spectra-batch   = "data_lake.ingest.desi_parallel_ingest:cli"
dl-ingest-catalog-batch   = "data_lake.ingest.catalog_parallel_ingest:cli"
dl-validate-spectra-ingest = "data_lake.ingest.validate_spectra_ingest:cli"
dl-validate-catalog-ingest = "data_lake.ingest.validate_catalog_ingest:cli"
dl-validate-catalog-spectra-link = "data_lake.ingest.validate_catalog_spectra_link:cli"
dl-validate-cutout-ingest = "data_lake.ingest.validate_cutout_ingest:cli"
dl-ingest-catalog-from-list = "data_lake.ingest.file_list_ingest:cli_catalog_list"
dl-ingest-cutouts-from-list = "data_lake.ingest.file_list_ingest:cli_cutout_list"
dl-ingest-spectra-from-list = "data_lake.ingest.file_list_ingest:cli_spectra_list"
dl-rebuild-catalog-indices = "data_lake.ingest.update_catalog_indices:main"
dl-extract-spectra-subset = "data_lake.export.spectra_subset:cli"
dl-extract-spplate-catalog = "data_lake.export.spplate_catalog:cli"
dl-extract-catalog = "data_lake.export.catalog_extract:cli"
dl-pack-tile       = "data_lake.share.pack_tile:cli"
dl-generate-cutout-fits = "data_lake.cutouts.generate_fits:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["data_lake*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
