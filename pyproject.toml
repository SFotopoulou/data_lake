[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-lake"
version = "0.1.0"
description = "Astronomy data lake: wide multi-survey catalogs (Parquet/HATS) + galaxy cutout stacks (Zarr v3)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sotiria Fotopoulou" }]
requires-python = ">=3.11"
dependencies = [
    # Array / columnar I/O
    "pyarrow>=15.0",
    "zarr>=3.0",
    "numcodecs>=0.13",
    # Catalog query engines
    "duckdb>=0.10",
    "polars>=0.20",
    "pandas>=2.0",
    # Astronomy
    "astropy>=6.0",
    "healpy>=1.16",
    # ML
    "torch>=2.2",
    "numpy>=1.26",
    # Utilities
    "tqdm>=4.66",
    "click>=8.1",
]

[project.optional-dependencies]
desi = ["desispec>=0.62"]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ipykernel",
    "jupyterlab",
    "matplotlib",
    "napari",
]

[project.scripts]
dl-init            = "data_lake.admin.init_lake:dl_init"
dl-ingest-catalog  = "data_lake.ingest.fits_to_parquet:cli"
dl-ingest-cutouts  = "data_lake.ingest.fits_to_zarr:cli"
dl-ingest-spectra  = "data_lake.ingest.fits_to_spectra_zarr:cli"
dl-pack-tile       = "data_lake.share.pack_tile:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["data_lake*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
